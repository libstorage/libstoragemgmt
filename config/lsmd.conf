allow-plugin-root-privilege = true;

# Maximum number of concurrent plugin processes per client uid, 0 for no
# limit.  See lsmd.conf(5).
# max-connections-per-uid = 64;

# Seconds a client has to complete plugin_register before the plugin gives
# up on it.  Raise this if a plugin's array is slow to authenticate.  See
# lsmd.conf(5).
# plugin-registration-timeout = 30;
